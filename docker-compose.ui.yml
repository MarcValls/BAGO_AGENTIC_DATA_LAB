services:
  api:
    image: bago-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - BAGO_API_HOST=0.0.0.0
      - BAGO_RUNTIME_MODE=container
    volumes:
      - ./demo_output/latest:/app/demo_output/latest:ro
      - ./agents/created:/app/agents/created
      - ./.bago:/app/.bago
      - ./jobs/history:/app/jobs/history
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  # Optional: Jaeger for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "127.0.0.1:16687:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
