name: GEX contract candidate consistency

on:
  push:
    paths:
      - docs/governed-execution/**
      - .github/workflows/gex-contract-consistency.yml
  pull_request:
    paths:
      - docs/governed-execution/**
      - .github/workflows/gex-contract-consistency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-only-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install pytest==9.0.3
      - name: Validate GEX contract structure and fail-closed claims
        run: python -m pytest docs/governed-execution/verification/test_gex_contract_consistency.py -q
